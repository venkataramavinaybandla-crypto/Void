- unit_id: CO3_01_U06
  topic: Usable host count
  definition: Traditional IPv4 subnetting commonly reserves network and broadcast addresses, though
    cloud platform conventions may differ for special addresses.
  detailed_explanation: For a conventional subnet with h host bits, usable hosts are often 2^h
    minus two; provider-reserved addresses must also be considered.
  working_principle: Identify the source, destination, protocol, address range, route decision,
    filtering boundary and expected response. Trace the forward and return paths separately. Use
    configuration and telemetry to verify each assumption.
  worked_example: A conventional /24 has 254 usable host addresses before provider-specific reservations.
