- unit_id: CO3_01_U05
  topic: Address range calculation
  definition: A CIDR block defines a contiguous range of addresses sharing a common prefix.
  detailed_explanation: Calculate the block size from the remaining host bits and align the network
    address to the block boundary.
  working_principle: Identify the source, destination, protocol, address range, route decision,
