metadata:
  course_title: Cloud Infrastructure and Services
  course_code: 25CS2206E
  semester: 2026-2027 Even Semester
  course_outcome: CO3
  concept_id: CO3_05
  concept_title: Security Groups, Network ACLs and Traffic Filtering
  source_alignment: Based on CO3 and Sessions 9-12 plus Practical Sessions 5-6 in the uploaded
    CDIS handout.
  coverage: Cloud IP addressing, CIDR, subnet planning, virtual networks, routing, traffic filtering,
    private access, NAT, load balancing, DNS, CDN, hybrid connectivity and network troubleshooting.
  provider_scope:
  - AWS
  - Microsoft Azure
  - Google Cloud
  intended_level: Undergraduate CSE; application, analysis and fault diagnosis
  line_count_target: At least 350 substantive YAML lines
learning_outcomes:
- Calculate IPv4 CIDR ranges, subnet boundaries and usable address capacity.
- Design virtual networks with public and private subnets, routes and controlled egress.
- Analyze stateful and stateless filtering, NAT and private service access.
- Evaluate L4/L7 load balancing, DNS routing, CDN and hybrid connectivity.
- Diagnose network faults using resolve, route, reach and respond evidence.
prerequisites:
- Basic IPv4, binary arithmetic and TCP/IP concepts.
- Basic understanding of client-server applications and HTTP.
- Familiarity with Linux or Windows command-line networking tools.
concept_map:
  central_concept: Security Groups, Network ACLs and Traffic Filtering
  major_dimensions:
  - Addressing and subnet allocation
  - Virtual network architecture and routing
  - Traffic filtering and private service access
  - Traffic distribution, DNS and content delivery
  - Hybrid connectivity and evidence-led troubleshooting
  relationships:
  - Addressing defines which destinations can be represented and routed.
  - Routes select a path while filtering controls whether traffic is permitted.
  - DNS identifies endpoints while load balancers distribute traffic to healthy targets.
  - CDNs serve eligible content near users while hybrid links connect separate network domains.
  - Troubleshooting follows the request path from name resolution through application response.
core_units:
- unit_id: CO3_05_U01
  topic: Traffic filtering layers
  definition: Cloud network filtering can operate at interface, subnet, network or managed-service
    boundaries.
  detailed_explanation: Identify which layer evaluates the packet and whether the rule is stateful
    or stateless.
  working_principle: Identify the source, destination, protocol, address range, route decision,
    filtering boundary and expected response. Trace the forward and return paths separately. Use
    configuration and telemetry to verify each assumption.
  worked_example: An instance security group and subnet ACL both affect a connection.
  design_checks:
  - Is the address plan non-overlapping and large enough for expected growth?
  - Does the route table select the intended next hop for both directions?
  - Which security control evaluates the flow, and is it stateful or stateless?
  - What evidence proves that the request reached the intended endpoint?
  tradeoffs:
  - Evaluate security, availability, latency and cost together.
  - Consider operational complexity and the blast radius of a route or policy change.
  - Distinguish control-plane configuration success from actual data-plane connectivity.
  troubleshooting_checks:
  - Record source, destination, protocol, port and timestamp.
  - Verify DNS answer and TTL if a hostname is involved.
  - Inspect route selection and next-hop health.
  - Inspect security groups, ACLs, firewalls and endpoint policies.
  - Test transport reachability and then application response.
  - Correlate flow logs, load-balancer health and application logs.
  review_questions:
  - Define traffic filtering layers and explain its role in cloud network architecture.
  - Analyze the worked example and identify a likely failure mode.
  - Evaluate the security, latency and cost trade-offs of traffic filtering layers.
- unit_id: CO3_05_U02
  topic: Security group
  definition: A security group is commonly a stateful virtual firewall associated with a network
    interface or resource.
  detailed_explanation: Rules generally define allowed traffic; response traffic for an allowed
    connection is tracked automatically.
  working_principle: Identify the source, destination, protocol, address range, route decision,
    filtering boundary and expected response. Trace the forward and return paths separately. Use
    configuration and telemetry to verify each assumption.
  worked_example: An application security group allows inbound 443 from a load balancer security
    group.
  design_checks:
  - Is the address plan non-overlapping and large enough for expected growth?
  - Does the route table select the intended next hop for both directions?
  - Which security control evaluates the flow, and is it stateful or stateless?
  - What evidence proves that the request reached the intended endpoint?
  tradeoffs:
  - Evaluate security, availability, latency and cost together.
  - Consider operational complexity and the blast radius of a route or policy change.
  - Distinguish control-plane configuration success from actual data-plane connectivity.
  troubleshooting_checks:
