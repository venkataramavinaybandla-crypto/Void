- unit_id: CO3_05_U04
  topic: Stateful filtering
  definition: A stateful filter tracks connection state and permits related response traffic according
    to the connection.
  detailed_explanation: This simplifies return traffic rules but does not remove the need to allow
    the initiating flow.
  working_principle: Identify the source, destination, protocol, address range, route decision,
