- unit_id: CO3_07_U04
  topic: TTL
  definition: Time to live controls how long DNS answers may be cached by resolvers.
  detailed_explanation: Lower TTL can improve change responsiveness but increases query volume;
    existing caches may retain prior answers until expiry.
  working_principle: Identify the source, destination, protocol, address range, route decision,
    filtering boundary and expected response. Trace the forward and return paths separately. Use
    configuration and telemetry to verify each assumption.
  worked_example: A 60-second TTL creates a nominal cache window, not a guarantee of immediate
    global convergence.
