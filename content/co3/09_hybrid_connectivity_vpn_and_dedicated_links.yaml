provider_comparison:
  comparison_method: Compare network scope, address model, route behavior, filtering semantics,
    endpoint support, DNS behavior, load-balancer layer, hybrid options, telemetry and pricing.
    Product names are not proof of identical behavior.
  aws: AWS networking examples include Amazon VPC, subnets, route tables, Internet Gateway, NAT
    Gateway, security groups, network ACLs, VPC endpoints, Elastic Load Balancing, Route 53, CloudFront,
    Site-to-Site VPN, Direct Connect and VPC Flow Logs.
  azure: Azure networking examples include Virtual Network, subnets, route tables, Network Security
    Groups, Azure Firewall, NAT Gateway, Private Link/private endpoints, Azure Load Balancer,
    Application Gateway, Azure DNS, Azure Front Door, VPN Gateway and ExpressRoute.
  google_cloud: Google Cloud networking examples include VPC networks, subnets, routes, firewall
    rules, Cloud NAT, Private Service Connect, Cloud Load Balancing, Cloud DNS, Cloud CDN, Cloud
    VPN, Cloud Interconnect and VPC Flow Logs.
  comparison_checklist:
  - What is the virtual network and subnet scope?
  - How are routes associated and how is longest-prefix or priority behavior determined?
  - Are security rules stateful or stateless, and at what resource boundary do they apply?
  - How does private service access work for the selected service?
  - What load-balancer layers and health-check options are supported?
  - Which DNS routing policies and private DNS mechanisms are available?
  - What hybrid VPN or dedicated connectivity options exist?
  - Which flow logs and network diagnostics can prove the packet path?
  - Which NAT, inter-zone, load-balancer and data-transfer charges apply?
architecture_and_workflow:
  reference_topology:
  - Client or internet user
  - Public DNS and optional CDN
  - Internet-facing L7 or L4 load balancer
  - Private application subnets distributed across zones
  - Private database or managed service subnet
  - NAT or private service endpoint for required outbound service access
  - Optional VPN or dedicated connection to on-premises networks
  network_design_steps:
  - Collect application flows, users, protocols, ports and data classification.
  - Choose a non-overlapping address space and reserve growth capacity.
  - Create subnets by role and failure domain.
  - Create route tables and document every next hop.
  - Attach internet, NAT, peering, endpoint or hybrid gateways as required.
  - Apply least-access security groups, ACLs and firewall policies.
  - Configure DNS, load balancing and health checks.
  - Enable flow logging and application-level tracing.
  - Test both forward and return paths from representative clients.
  - Record costs, ownership and teardown procedures.
  evidence_to_collect:
  - CIDR allocation table and subnet calculations
  - Route tables and gateway attachment state
  - Security group, ACL and firewall rule exports
  - DNS query output and TTL values
  - Load-balancer listener and target health evidence
  - Flow logs and connectivity test output
  - VPN tunnel state and BGP route information
  - Latency, packet loss and throughput measurements
practical_labs:
- lab_id: CO3_09_LAB01
  title: VPC and gateway foundation
  objective: Create a virtual network, attach an internet gateway and understand subnet route
    behavior.
  handout_alignment: 'Practical Session 5: VPC isolated network and Internet Gateway attachment.'
  procedure:
  - Create a VPC and record the CIDR block.
  - Create a public subnet and associate a route table.
  - Attach an internet gateway to the VPC.
  - Add a default route to the internet gateway in the public route table.
  - Launch a temporary test instance with suitable public addressing and tightly scoped access.
  - Test connectivity and record route and security evidence.
  - Remove temporary resources after the lab.
  safety_controls:
  - Enable MFA and use a least-privilege learning identity.
  - Set a budget alert before creating chargeable resources.
  - Restrict inbound access to the learner's approved source address.
  - Do not expose databases or administrative ports publicly.
  - Delete public IPs and all temporary network resources after testing.
  deliverables:
  - VPC diagram
  - CIDR and subnet table
  - Route table evidence
  - Connectivity test
  - Teardown confirmation
- lab_id: CO3_09_LAB02
  title: One public and two private subnets with NAT
  objective: Build the topology specified by the CO3 practical and prove private subnet outbound
    connectivity.
  handout_alignment: 'Practical Session 6: create a VPC with 120.0.0.0/16, one public subnet and
    two private subnets, and connect a NAT gateway for private subnet internet connectivity.'
  source_specific_note: The handout specifies 120.0.0.0/16. Preserve this value when documenting
    the prescribed exercise. For real production address planning, use an address range that the
    organization is authorized to use, typically an RFC1918 private range, and avoid overlapping
    connected networks.
  procedure:
  - Record the handout-specified VPC CIDR exactly in the lab plan.
  - Divide the VPC range into three non-overlapping subnet ranges with adequate capacity.
  - Create one public subnet and two private subnets.
  - Attach an internet gateway and configure the public subnet route table.
  - Create a NAT gateway in the public subnet with the required public address allocation.
  - Configure the private subnet route table to send internet-bound traffic to NAT.
  - Launch a test instance in a private subnet without a public IP.
  - Test outbound access from the private instance and verify that unsolicited inbound internet
    access is not enabled.
  - Inspect flow evidence and route tables, then tear down NAT and other billable resources.
  safety_controls:
  - Confirm the account, region and billing budget before provisioning NAT.
  - Do not use the lab CIDR in a production network without validating address ownership and routing
    implications.
  - Keep private test instances without public addresses.
  - Delete NAT gateways and allocated public IPs after the test.
  deliverables:
  - Address allocation table
  - Public/private route tables
  - NAT configuration evidence
  - Outbound connectivity result
  - Cost and teardown checklist
scenario_bank:
- scenario: A private VM cannot download operating-system updates although the VPC has an internet
    gateway.
  task: Trace the subnet route, NAT placement, public subnet route, security policy and return
    path.
  expected_reasoning: An internet gateway alone does not give a private subnet direct outbound
    access; a suitable NAT path and routes are required.
- scenario: A TCP connection times out even though DNS resolves the destination.
  task: Inspect route selection, filtering, NAT and return traffic, then use flow evidence.
  expected_reasoning: Name resolution and routing are separate stages; a timeout can indicate
    silent filtering or an incomplete path.
- scenario: A request reaches a load balancer but receives HTTP 503.
  task: Inspect listener rules, target registration, health checks, security rules and backend
    logs.
  expected_reasoning: Transport reachability to the load balancer does not prove that healthy
    application targets exist.
- scenario: DNS failover changes the authoritative answer but some users still reach the old region.
  task: Analyze TTL, resolver caching, health-check interval and client retry behavior.
  expected_reasoning: Client-observed recovery can lag the control-plane change because cached
    answers remain valid until expiry.
common_misconceptions:
- claim: A public subnet automatically makes every instance public.
  correction: The route table, public addressing and filtering configuration all affect reachability.
- claim: A NAT gateway allows unsolicited inbound internet connections to private instances.
  correction: NAT commonly supports outbound-initiated connectivity; it is not a general inbound
    publishing mechanism.
- claim: Security groups and network ACLs behave identically.
  correction: Security groups are commonly stateful while network ACLs are commonly stateless
    and require explicit return traffic rules.
- claim: If DNS resolves, the network is working.
  correction: DNS only establishes a name-to-address answer; route, transport, filtering and application
    behavior still need validation.
- claim: A load balancer health check proves the whole user journey works.
  correction: A shallow health check may not exercise authentication, business logic or downstream
    dependencies.
- claim: Private connectivity means trusted connectivity.
  correction: Private paths still require identity, encryption where appropriate, routing and
    traffic filtering.
troubleshooting_method:
  sequence:
  - 'Resolve: confirm the hostname, resolver, returned address and TTL.'
  - 'Route: inspect the source subnet route table, destination prefix and next hop.'
  - 'Reach: test endpoint, port, protocol, security rules, ACLs and return path.'
  - 'Respond: inspect TLS, HTTP status, load-balancer health and application dependencies.'
  command_toolbox:
  - tool: nslookup or dig
    purpose: Inspect DNS answer, resolver and TTL-related details.
  - tool: ip route or route print
    purpose: Inspect local route selection and default gateway.
  - tool: ping or traceroute/tracert
    purpose: Test ICMP reachability or observe a possible network path; interpret filtered hops
      cautiously.
  - tool: curl, nc or an equivalent TCP client
    purpose: Test application response or transport connection to a specific port.
  incident_record_fields:
  - Timestamp
  - Source address
  - Destination address
  - Protocol
  - Port
  - DNS answer
  - Route decision
  - Filtering evidence
  - Connection result
  - Application response
  - Root cause
  - Remediation
  - Verification
examination_bank:
  remember:
  - Define CIDR and explain the purpose of a subnet mask.
  - Differentiate a public subnet and a private subnet.
  - State the difference between a security group and a network ACL.
  - Define NAT, DNS TTL and CDN.
  understand:
  - Explain how a private subnet obtains outbound internet access through NAT.
  - Explain why stateless filtering requires explicit return traffic rules.
  - Describe how DNS caching influences failover time.
  - Differentiate L4 and L7 load balancing.
  apply:
  - Calculate the network range and usable host capacity for a given CIDR block.
  - Design one public and two private subnets with appropriate route tables.
  - Configure a rule set that permits HTTPS from a load balancer to an application tier.
  - Select an endpoint or NAT path for private access to a cloud service.
  analyze:
  - Analyze a timeout using the resolve-route-reach-respond sequence.
  - Trace the return-rule trap in a stateless ACL.
  - Analyze why a DNS failover event takes longer for clients than the health-check interval.
  - Use flow logs to identify the likely network boundary dropping a packet.
  evaluate:
  - Evaluate two network designs for security, resiliency, latency and cost.
  - Choose between NAT-based access and private service endpoints for a stated workload.
  - Evaluate an L4 or L7 load-balancing design for a given protocol and routing requirement.
  - Defend a hybrid connectivity choice between VPN and a dedicated circuit.
  scenario_based:
  - A VM resolves a hostname but TCP 443 times out. Identify the next four checks in order.
  - A private application can reach the internet but cannot access a managed storage service privately.
    Diagnose endpoint DNS and route configuration.
  - A service becomes unavailable after one zone loses capacity. Evaluate load-balancer health,
    subnet capacity and failover behavior.
  - Users in one region receive stale content after a deployment. Analyze CDN cache key, TTL and
    invalidation.
revision:
  key_terms:
  - IPv4
  - CIDR
  - subnet
  - VPC
  - VNet
  - route table
  - Internet Gateway
  - NAT Gateway
  - security group
  - network ACL
