  last_minute_checklist:
  - Can I convert an IPv4 address and mask into a network range?
  - Can I allocate non-overlapping public and private subnets?
  - Can I trace forward and return routes?
  - Can I explain stateful versus stateless filtering?
  - Can I distinguish NAT from private service endpoints?
  - Can I compare L4 and L7 load balancing?
  - Can I calculate how TTL affects DNS failover?
  - Can I diagnose a failure using resolve, route, reach and respond?
  summary: CO3 connects addressing, routing and filtering with the services that deliver and protect
    application traffic. A strong network design uses non-overlapping address space, explicit
    routes, least-access filtering, suitable private access, resilient traffic distribution and
    measurable DNS and hybrid behavior. A strong diagnosis follows the packet and request path
    using evidence.
glossary:
- term: CIDR
  meaning: Classless Inter-Domain Routing notation that expresses an IP prefix length.
- term: VPC/VNet
  meaning: A logically isolated virtual network construct provided by a cloud platform.
- term: NAT
  meaning: Network address translation used to translate packet address information.
- term: TTL
  meaning: Time to live; in DNS it controls how long an answer may be cached.
- term: ACL
  meaning: Access control list; a rule set that permits or denies traffic.
- term: BGP
  meaning: Border Gateway Protocol, used to exchange routing information between networks.
- term: CDN
  meaning: Content delivery network that serves content through distributed edge locations.
- term: RTO
  meaning: Recovery time objective; included here only as a cross-topic service recovery term,
    not a core CO3 focus.
study_guidance:
  recommended_sequence:
  - Master IPv4 binary arithmetic and CIDR before designing subnets.
  - Draw a VPC/VNet with public and private subnet roles.
  - Trace internet, NAT, endpoint and hybrid routes.
  - Compare stateful and stateless filtering with request and return packets.
  - Study load balancers, DNS policies, TTL and CDN caching.
  - Practice the resolve-route-reach-respond diagnostic sequence.
  - Complete the two handout-aligned VPC practical labs and record evidence.
  answer_quality_standard: Show subnet arithmetic, state the route and next hop, identify the
    filtering boundary, trace the return path and support diagnosis with command output or flow
    evidence. Do not claim a packet is reachable merely because DNS resolves or an instance is
    marked running.
