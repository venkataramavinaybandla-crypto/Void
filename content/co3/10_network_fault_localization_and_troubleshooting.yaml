  definition: A reachability failure occurs when the destination cannot be contacted at the network
    or transport layer.
  detailed_explanation: Check security groups, ACLs, firewalls, listening ports, NAT and return
    traffic.
  working_principle: Identify the source, destination, protocol, address range, route decision,
    filtering boundary and expected response. Trace the forward and return paths separately. Use
    configuration and telemetry to verify each assumption.
