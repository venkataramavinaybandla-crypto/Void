    refusal and application-response failures.
  detailed_explanation: A practical sequence can use nslookup/dig, ip route/route print, ping
    or traceroute, and curl/nc/telnet depending on the OS and target. Choose commands that test
    distinct layers.
  working_principle: Identify the source, destination, protocol, address range, route decision,
    filtering boundary and expected response. Trace the forward and return paths separately. Use
    configuration and telemetry to verify each assumption.
