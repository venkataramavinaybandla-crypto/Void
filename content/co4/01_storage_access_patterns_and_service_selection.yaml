- unit_id: CO4_01_U10
  topic: Durability and availability
  definition: Durability concerns the probability that stored data remains intact; availability
    concerns whether it can be accessed when needed.
  detailed_explanation: Do not treat replication or service availability as a substitute for backup
    and recovery.
  worked_example: A replicated object service can still replicate an accidental deletion.
