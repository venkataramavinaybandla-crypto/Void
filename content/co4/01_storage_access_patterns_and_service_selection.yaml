  definition: Block storage exposes a volume as a block device that an operating system can format
    and mount.
  detailed_explanation: It suits low-latency random reads and writes for boot disks, filesystems
    and many transactional workloads.
  worked_example: A cloud VM uses an attached block volume for its database files.
