provider_comparison:
  aws: 'AWS examples: S3; EBS; EFS and FSx; RDS and Aurora; DynamoDB; ElastiCache; Redshift and
    Athena; Kinesis; SQS and EventBridge; Glue and Step Functions; AWS Backup; Snow Family.'
  azure: 'Azure examples: Blob Storage; Managed Disks; Azure Files; Azure SQL Database and Managed
    Instance; Cosmos DB; managed Redis offerings; Synapse/Fabric analytics; Event Hubs; Service
    Bus and Event Grid; Data Factory and Logic Apps; Azure Backup; Data Box.'
  google_cloud: 'Google Cloud examples: Cloud Storage; Persistent Disk and Hyperdisk; Filestore;
    Cloud SQL and AlloyDB; Firestore and Bigtable; Memorystore; BigQuery; Pub/Sub; Dataflow and
    Workflows; Backup and DR; Transfer Appliance.'
  comparison_method: Compare actual workload fit and service semantics rather than assuming that
    similarly named products are identical.
  checklist:
  - Which protocols and APIs are supported?
  - What durability and availability design is provided?
  - What latency, throughput, IOPS and scaling limits apply?
  - How are backups, snapshots, versioning and immutability implemented?
  - What consistency and replication behavior is provided?
  - Which costs apply to capacity, requests, retrieval, compute and transfer?
  - Can the service meet the required RTO and RPO in a tested recovery?
architecture_workflow:
  data_lifecycle:
  - Generate or ingest data.
  - Validate schema, identity and metadata.
  - Write to the storage or database service selected for the access pattern.
  - Use cache or read replicas where they meet freshness requirements.
  - Process or analyze data through query, ETL, stream or workflow services.
  - Protect data through backup, versioning, replication and retention.
  - Test restoration and record recovery evidence.
  design_steps:
  - Classify data by structure, size, sensitivity, access frequency and retention.
  - Define read/write patterns, concurrency, consistency and latency targets.
  - Select object, block, file, relational or NoSQL services.
  - Estimate capacity, IOPS, throughput, request volume and unit cost.
  - Design cache and analytics paths without violating freshness requirements.
  - Define backup frequency, retention, isolation and encryption.
  - Set explicit RTO and RPO values for each workload tier.
  - Choose a recovery strategy and document dependency order.
  - Run restore and failover tests and compare measured results with objectives.
  evidence_to_collect:
  - Storage access pattern and protocol matrix
  - Volume performance and filesystem capacity metrics
  - Object lifecycle, versioning and retention configuration
  - Database connection, query and replication metrics
  - Cache hit ratio and eviction metrics
  - Pipeline backlog, throughput and processing lag
  - Backup job history and recovery point metadata
  - Restore duration, data-loss window and recovery cost
practical_alignment:
- lab_id: CO4_01_LAB_EBS
  title: Launch Linux EC2, attach a 20 GB EBS volume and resize it
  handout_alignment: Practical Session 7, mapped to CO4.
  objective: Attach a block storage volume to a Linux instance, inspect it safely, expand it and
    verify that the guest operating system reflects the new size.
  procedure:
  - Launch a temporary Linux EC2 instance.
  - Create a 20 GB EBS volume in a compatible Availability Zone.
  - Attach the volume to the instance.
  - Identify the correct device using read-only operating-system inspection commands.
  - Create a filesystem only if the volume is new and empty.
  - Mount the volume and verify read/write access.
  - Create a snapshot before the resize exercise.
  - Increase the EBS volume size in the provider control plane.
  - Expand the partition if applicable and then grow the filesystem using the correct filesystem-specific
    utility.
  - Verify the new block-device and filesystem capacity inside Linux.
  - Record the before/after evidence and remove lab resources safely.
  safety_controls:
  - Never format a device until its identity and data state are confirmed.
  - Create a snapshot before destructive or irreversible changes.
  - Use a test instance and non-production data.
  - Check the device naming and filesystem type before running resize commands.
  - Delete or detach resources after confirming that no required data remains.
  deliverables:
  - Instance and volume details
  - Device identification evidence
  - Before/after capacity output
  - Snapshot record
  - Teardown confirmation
- lab_id: CO4_01_LAB_RDS
  title: Launch an RDS instance and access MySQL using Workbench
  handout_alignment: Practical Session 8, mapped to CO4.
  objective: Provision a managed relational database and validate secure client connectivity.
  procedure:
  - Select a supported managed MySQL database configuration for a learning environment.
  - Choose a suitable VPC and private networking configuration.
  - Configure database credentials using secure secret handling.
  - Restrict inbound database access to the approved client source or application security group.
  - Create the database and wait for the endpoint to become available.
  - Connect using MySQL Workbench from an authorized network path.
  - Run basic schema and query operations using test data.
  - Inspect connection and database metrics.
  - Document the endpoint, network policy and query evidence without exposing credentials.
  - Delete the database after the lab if it is no longer required.
  safety_controls:
  - Do not enable unrestricted public database access.
  - Do not store passwords in YAML, source control or screenshots.
  - Use test records rather than personal or production data.
  - Check backup retention and billing before provisioning.
  - Remove the database or reduce resources after the exercise.
  deliverables:
  - Database configuration
  - Network access rule
  - Workbench connection evidence with secrets redacted
  - SQL query output
  - Teardown or retention decision
scenario_bank:
- scenario: A database volume has low average throughput but high query latency.
  task: Evaluate IOPS, queue depth, random I/O, locks and application wait time.
  expected_reasoning: Average throughput alone cannot establish that storage is not the bottleneck.
- scenario: A team stores large objects in a hot storage tier but reads them only once per year.
  task: Evaluate lifecycle transitions, retrieval charges and retention requirements.
  expected_reasoning: A colder tier may reduce capacity cost but retrieval delay and fees must
    be included.
- scenario: A relational database is healthy but read traffic causes primary CPU saturation.
  task: Evaluate indexing, caching and read replicas.
  expected_reasoning: Read scaling options should be selected while accounting for replica lag
    and consistency.
- scenario: A NoSQL table throttles despite spare aggregate capacity.
  task: Inspect partition-key distribution and hot partitions.
  expected_reasoning: Concentrated access to one partition can cause throttling even when total
    capacity appears available.
- scenario: A backup job reports success but a restore fails.
  task: Inspect backup chain, encryption keys, retention and restore-test evidence.
  expected_reasoning: A successful backup operation does not prove that a complete and usable
    recovery path exists.
- scenario: A workload has a 30-minute RTO and a 5-minute RPO.
  task: Compare backup/restore, pilot light, warm standby and multi-site options.
  expected_reasoning: The chosen approach must meet both measured recovery time and data-loss
    window, not merely one objective.
common_misconceptions:
- claim: Object, block and file storage are interchangeable.
  correction: They expose different access semantics and protocols and fit different workload
    patterns.
- claim: RAID is a backup.
  correction: RAID can improve availability or performance but does not protect against logical
    deletion, corruption or site loss.
- claim: A read replica is the same as a standby.
  correction: A read replica may serve read traffic; a standby is generally intended for failover,
    depending on the managed service.
- claim: A cache is always safe to use for database data.
  correction: Cache freshness, invalidation, consistency and failure behavior must be designed
    explicitly.
- claim: A successful backup job proves recoverability.
  correction: Only a tested restore validates the full recovery process.
- claim: RTO and RPO measure the same thing.
  correction: RTO measures time to restore service; RPO measures acceptable data loss in time.
troubleshooting_method:
  storage_sequence:
  - Identify the storage abstraction and operation that failed.
  - Check resource state, attachment, endpoint and network path.
  - Inspect capacity, IOPS, throughput, latency and queue depth.
  - Check filesystem, permissions, quotas and application behavior.
  - Validate integrity and restore from a protected recovery point if needed.
  database_sequence:
  - Confirm DNS, endpoint, port and network access.
  - Validate identity and credentials without exposing secrets.
  - Inspect connections, query plans, locks and resource utilization.
  - Check replication lag, failover events and storage capacity.
  - Test the application query and record the result.
  recovery_sequence:
  - Declare the recovery scenario and start the incident clock.
  - Identify the selected recovery point and verify required keys and permissions.
  - Restore infrastructure and data in dependency order.
  - Validate integrity, application behavior and traffic routing.
  - Record measured RTO, RPO, data-loss window and cost.
examination_bank:
  remember:
  - Differentiate object, block and file storage.
  - Define IOPS, throughput, RAID, LUN, RTO and RPO.
  - List common relational and NoSQL data models.
  - Define full, incremental and differential backups.
  understand:
  - Explain how object lifecycle policies reduce storage cost.
  - Explain multi-AZ standby versus read replica.
  - Describe cache-aside and cache invalidation.
  - Explain how backup-chain dependencies affect restoration.
  apply:
  - Select a storage service for a stated access pattern.
  - Resize a block volume and verify the guest filesystem capacity.
  - Choose a database model for a given query pattern.
  - Construct a full and incremental restore sequence.
  analyze:
  - Analyze a storage-path failure using device and service metrics.
  - Diagnose a hot NoSQL partition from access distribution.
  - Analyze cache stampede and stale-read behavior.
  - Calculate whether a recovery test meets stated RTO and RPO.
  evaluate:
  - Compare object storage classes using total cost and retrieval behavior.
  - Evaluate relational versus NoSQL for a specified application.
  - Choose between backup/restore, pilot light, warm standby and multi-site DR.
  - Compare AWS, Azure and Google Cloud data services by workload semantics and unit cost.
  scenario_based:
  - A 20 GB EBS volume is enlarged but Linux still reports the old filesystem size. Explain the
    verification and expansion layers.
  - A MySQL application experiences failover and stale reads. Analyze standby, replica and connection
    behavior.
  - A data lake query scans excessive data. Recommend partitioning, format and query-in-place
    improvements.
  - A restore completes but misses the recovery objective. Identify which stage caused the delay
    and what evidence is needed.
