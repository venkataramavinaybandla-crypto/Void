metadata:
  course_title: Cloud Infrastructure and Services
  course_code: 25CS2206E
  semester: 2026-2027 Even Semester
  course_outcome: CO4
  concept_id: CO4_02
  concept_title: Block Storage, File Systems, RAID, LUNs and Provisioning
  source_alignment: CO4 of the uploaded handout; Sessions 13-16 and Practical Sessions 7-8 where
    applicable.
  coverage: Storage access patterns, object/block/file services, managed relational and NoSQL
    databases, caching, analytics, data processing, backup, disaster recovery, RTO and RPO.
  line_count_target: At least 300-400 substantive YAML lines
course_outcome_statement: Evaluate storage and data services — object, block and file at protocol
  level, managed relational and NoSQL stores, caches and analytics services — by access pattern,
  durability, latency and unit cost; and design a backup and disaster-recovery posture that meets
  a stated RTO and RPO.
learning_outcomes:
- Evaluate object, block and file storage by protocol, access pattern, durability, latency and
  cost.
- Select managed relational and NoSQL databases based on data model, consistency and access pattern.
- Explain caching, analytics, streaming, ETL, queues, event buses and workflow services.
- Construct full, incremental and differential backup chains and validate restore procedures.
- Design disaster recovery strategies against stated RTO and RPO requirements.
prerequisites:
- Basic file systems, disks and operating-system storage concepts.
- Basic SQL and client-server database concepts.
- Basic networking and cloud service concepts.
concept_map:
  central_concept: Block Storage, File Systems, RAID, LUNs and Provisioning
  dimensions:
  - Data access pattern and protocol
  - Durability, availability, latency and throughput
  - Relational and NoSQL data services
  - Caching, analytics and event/data processing
  - Backup, restoration and disaster recovery
  relationships:
  - Access patterns determine the appropriate storage and database model.
  - Storage protocol and performance characteristics affect application design.
  - Caches reduce repeated backend work but require freshness and invalidation policies.
  - Analytics and data-processing services move or query data using different latency and throughput
    models.
  - Backup and disaster recovery are evaluated through measured RTO, RPO, restore time and cost.
core_units:
- unit_id: CO4_02_U01
  topic: Block device fundamentals
  definition: A block device presents addressable fixed-size blocks to an operating system.
  detailed_explanation: The guest OS manages partitions, filesystems and application-level layout.
  worked_example: A VM attaches a cloud volume and formats it with ext4.
  decision_questions:
  - What operations does the application perform most frequently?
  - What latency, durability, availability and consistency does the workload require?
  - What capacity, throughput, IOPS or concurrency is expected at peak?
  - Which service charges apply during normal use, retrieval, replication and recovery?
  tradeoffs:
  - Compare performance against the total cost of ownership.
  - Account for operational responsibility and provider-specific limits.
  - Separate high availability from backup and disaster recovery.
  - Validate behavior with a representative workload and a restore test.
  diagnostic_steps:
  - Define the symptom and identify the affected data service.
  - Check service health, resource state, quota and recent configuration changes.
  - Inspect application metrics, service metrics and relevant logs.
  - Test the exact access path and operation using a controlled client.
  - Verify data integrity and recovery behavior before closing the incident.
  review_questions:
  - Explain block device fundamentals and identify the workload for which it is suitable.
  - Analyze the worked example and identify one likely performance or reliability risk.
  - Evaluate the cost and recovery implications of block device fundamentals.
