  last_minute_checklist:
  - Can I select storage by access pattern and protocol?
  - Can I explain IOPS, throughput, RAID and LUNs?
  - Can I explain object lifecycle, versioning and object lock?
  - Can I compare relational and NoSQL data models?
  - Can I explain cache freshness and invalidation?
  - Can I distinguish ETL, streaming, queues and event buses?
  - Can I restore a full plus incremental or differential backup chain?
  - Can I calculate and measure RTO and RPO?
  - Can I justify a recovery strategy by cost and objectives?
  summary: CO4 is about matching data services to access patterns and evaluating them through
    durability, latency, throughput and unit cost. It also requires a recovery design that is
    tested against explicit RTO and RPO targets. Backup completion is not the same as proven recoverability.
glossary:
- term: IOPS
  meaning: Input/output operations per second.
- term: LUN
  meaning: Logical unit number identifying a logical storage unit presented to a host.
- term: RAID
  meaning: Redundant array of independent disks; combines devices for performance and/or redundancy.
- term: ETL
  meaning: Extract, transform and load.
- term: RTO
  meaning: Recovery Time Objective; target maximum time to restore service.
- term: RPO
  meaning: Recovery Point Objective; target maximum acceptable data-loss window.
- term: Pilot light
  meaning: A DR approach that keeps minimal core resources ready and provisions more capacity
    during recovery.
- term: Warm standby
  meaning: A scaled-down but functional recovery environment kept running.
study_guidance:
  recommended_sequence:
  - Start with object, block and file access semantics.
  - Study block performance, RAID, LUNs and the EBS resize practical.
  - Study object lifecycle, versioning, object lock and storage economics.
  - Compare managed relational and NoSQL databases, then caching.
  - Understand analytics, ETL, streaming, queues, event buses and workflows.
  - Construct full, incremental and differential backup chains.
  - Set RTO/RPO values and compare the four DR strategies.
  - Complete the EBS and RDS practicals and document evidence.
  answer_quality_standard: State the workload access pattern, explain the storage or data-service
    semantics, compare durability and performance, calculate relevant unit costs, and justify
    recovery using measured RTO and RPO. Keep provider-specific behavior explicit.
