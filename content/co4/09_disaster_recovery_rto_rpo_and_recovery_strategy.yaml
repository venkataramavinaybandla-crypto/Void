- unit_id: CO4_09_U04
  topic: RTO versus RPO
  definition: RTO measures recovery duration while RPO measures acceptable data loss.
  detailed_explanation: A design must satisfy both independently.
  worked_example: A system can restore quickly but still lose too much data.
  decision_questions:
