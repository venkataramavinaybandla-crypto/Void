  - Can I select storage by access pattern and protocol?
  - Can I explain IOPS, throughput, RAID and LUNs?
  - Can I explain object lifecycle, versioning and object lock?
  - Can I compare relational and NoSQL data models?
  - Can I explain cache freshness and invalidation?
