document:
  id: CO5-03
  title: Workload Identity, Federation and Credential Security
  session_alignment: '18'
  focus: Workload identity, roles, federation, static credential risks, temporary credentials and denial testing.
  level: Detailed undergraduate study notes
  important_scope_note: Provider-specific details are conceptual examples. Verify current provider documentation
    before implementing production controls.
learning_objectives:
- Explain the central concepts and terminology.
- Analyze the control flow and identify trust boundaries.
- Compare alternative designs and their trade-offs.
- Apply least privilege and validate it with evidence.
- Diagnose a realistic failure using logs, policies or telemetry.
units:
- unit: 1
  title: Workload identity concepts
  explanation: Workloads need identities to call cloud APIs, access data stores and communicate with other services.
    A workload identity binds a running workload to a principal and allows it to obtain credentials without embedding
    a long-lived secret in source code. Examples include VM instance roles, container service accounts, Kubernetes
    workload identity and function execution roles. The trust mechanism must prove which workload is requesting
    access.
  key_points:
  - Human identity represents a person; workload identity represents running software.
  - The identity should be bound to workload attributes such as service account, runtime or deployment identity.
  - Use separate identities for separate applications and environments.
  - Do not share one powerful identity across unrelated services.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 2
  title: Static credentials and their risks
  explanation: Static access keys and passwords are long-lived credentials that may be copied into source files,
    images, notebooks, CI logs or developer machines. They are difficult to rotate consistently and can remain valid
    after the original user or workload changes. Exposure can permit unauthorized API calls until the credential
    is disabled or expires. Avoid storing cloud access keys in repositories or container images.
  key_points:
  - 'Leak paths: Git history, build logs, environment dumps, screenshots, container layers and shared files.'
  - Blast radius depends on permissions and account scope.
  - Rotation alone is not enough if old copies remain valid or new copies are leaked.
  - Use secret scanning and revoke exposed credentials immediately.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 3
  title: Temporary credentials and role assumption
  explanation: Temporary credentials have a limited lifetime and are issued after a trusted identity assumes a role
    or exchanges a token. They reduce the period during which stolen credentials remain useful. The role's trust
    policy controls who may assume it; its permission policy controls what the resulting session can do. Apply session
    duration limits and conditions appropriate to the workload.
  key_points:
  - 'Trust policy: which identity source is allowed to obtain the role?'
  - 'Permission policy: what can the role session do?'
  - 'Session credentials: temporary access key/token material with an expiry.'
  - Session tags or claims can carry workload context when supported.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 4
  title: Federation for workforce access
  explanation: Workforce federation connects a corporate identity provider to cloud access. Users authenticate through
    the organization’s identity provider, often with SSO and MFA, then receive scoped cloud sessions. Centralized
    identity lifecycle management reduces local account sprawl. Federation design should include identity mapping,
    group/role mapping, MFA, session lifetime, break-glass access and deprovisioning.
  key_points:
  - SAML and OIDC are common federation protocols, serving different token and assertion patterns.
  - Map identity-provider groups or claims to cloud roles deliberately.
  - Avoid mapping broad groups to administrator roles by default.
  - Test account removal and session revocation behavior.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 5
  title: Kubernetes and container workload identity
  explanation: Containers should receive identity through the orchestrator or cloud integration rather than copied
    credentials. In Kubernetes, a service account can represent a workload; a cloud provider integration may exchange
    a projected token for short-lived cloud credentials. Restrict service-account token use, namespace permissions
    and role bindings. A pod should not inherit node-wide privileges when it needs only a narrow application role.
  key_points:
  - Use one service account per workload or trust boundary where practical.
  - Restrict token audience, issuer and subject claims where supported.
  - Avoid mounting powerful node credentials into application containers.
  - Review Kubernetes RBAC and cloud IAM together; they are separate authorization layers.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 6
  title: CI/CD workload identity
  explanation: Build and deployment systems need access to registries, cloud APIs and infrastructure. Prefer OIDC
    federation or an equivalent short-lived identity exchange over static cloud keys stored as CI secrets. Restrict
    trust to the expected repository, branch, environment or workflow identity. Separate build permissions from
    production deployment permissions and require approval for sensitive releases.
  key_points:
  - Limit which repositories and branches may assume deployment roles.
  - Use different roles for test, staging and production.
  - Do not expose deployment tokens to untrusted pull-request code.
  - Log role assumption and deployment actions.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 7
  title: Credential rotation and incident response
  explanation: When a credential is exposed, identify its owner and scope, disable or revoke it, inspect audit logs
    for use, rotate dependent secrets and validate that services recover. Search repositories and build systems
    for copies. Rotation should be automated where possible and supported by an owner, expiry and alerting process.
    Temporary credentials reduce exposure but do not eliminate the need for monitoring.
  key_points:
  - 'Contain: disable compromised credential or trust path.'
  - 'Investigate: query audit events for principal, source, actions and time range.'
  - 'Eradicate: remove copies, rotate related secrets and correct the leak path.'
  - 'Recover: validate workload operation with new identity flow.'
  - 'Learn: add scanning, policy checks and preventive tests.'
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 8
  title: Denial test for workload identity
  explanation: 'A denial test proves that the workload can perform its intended action but cannot access an unrelated
    resource or perform an unneeded destructive action. Use a test identity and non-production resources. Capture
    both successful and denied audit events. The negative test is essential: a workload that can read its own configuration
    but also enumerate every account is not least-privileged.'
  key_points:
  - 'Positive case: required resource/action is allowed.'
  - 'Negative case 1: unrelated resource access is denied.'
  - 'Negative case 2: destructive action is denied.'
  - 'Negative case 3: untrusted workload identity cannot assume the role.'
  - Store the test identity, policy version and audit evidence.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
worked_examples:
- scenario: A service needs to read one configuration object and nothing else.
  analysis: Identify its workload principal, exact read action, exact resource and any required context. Avoid broad
    account-wide permissions.
  expected_design: A dedicated workload identity with a narrowly scoped read permission and an explicit negative
    test against an unrelated object.
- scenario: A cloud API call returns AccessDenied even though an Allow statement exists.
  analysis: Check for explicit denies, resource policy restrictions, permission boundaries, session restrictions,
    organization guardrails and failed conditions.
  expected_design: Use the audit event and policy evidence to identify the controlling layer; change only that layer
    and retest.
common_misconceptions:
- Authentication success does not mean every requested action is authorized.
- A permission boundary or organization guardrail is not automatically a permission grant.
- Adding an Allow does not override a matching explicit Deny.
- Temporary credentials reduce long-lived credential risk but still require least privilege.
- Encryption does not replace authorization, secure application design or key protection.
- A compliance dashboard is not proof that every control is effective.
- A metric alert is not useful unless it leads to a clear action.
self_check:
- question: What principal is making the request, and what action/resource is being requested?
  expected_answer_elements:
  - identity
  - action
  - resource
  - context
- question: What is the difference between an explicit deny and an implicit deny?
  expected_answer_elements:
  - matching deny rule
  - absence of an applicable allow
- question: Why is workload identity preferable to a hard-coded static key?
  expected_answer_elements:
  - short-lived credentials
  - reduced leakage surface
  - scoped role
- question: What evidence demonstrates that a secret was rotated successfully?
  expected_answer_elements:
  - version change
  - automation/audit event
  - consumer update
  - validation
- question: How do metrics, logs and traces complement one another?
  expected_answer_elements:
  - aggregate trends
  - event detail
  - request path
exam_practice:
  short_answer:
  - Define least privilege and explain why it must be reviewed continuously.
  - Differentiate identity-based and resource-based policies.
  - Explain the purpose of a service control policy.
  - Differentiate a cryptographic key from an application secret.
  - Define SLI, SLO and error budget.
  analytical:
  - Analyze an AccessDenied request when identity policy allows the action but an organization guardrail denies
    it.
  - Design a workload identity flow for a containerized application.
  - Propose an envelope-encryption architecture and explain key ownership.
  - Map a compliance requirement to controls and auditable evidence.
  - Evaluate an alerting design that pages operators on every CPU spike.
  case_study: A production service suddenly cannot read a database secret. Determine the evidence to collect, policy
    layers to inspect, likely rotation-related causes, safe remediation and validation tests.
glossary:
- term: IAM
  definition: Identity and access management.
- term: Principal
  definition: Identity making an access request.
- term: Federation
  definition: Trust relationship that allows an external identity system to provide authentication assertions or
    tokens.
- term: SCP
  definition: Organization-level policy that limits maximum permissions in supported account models.
- term: KMS
  definition: Key management service used to manage cryptographic keys and operations.
- term: DEK
  definition: Data encryption key used to encrypt data.
- term: WAF
  definition: Web application firewall that evaluates HTTP/HTTPS requests.
- term: SLI
  definition: Measured indicator of service behavior.
- term: SLO
  definition: Target for an SLI over a defined time window.
- term: Trace
  definition: Linked spans representing a request's path through services.
