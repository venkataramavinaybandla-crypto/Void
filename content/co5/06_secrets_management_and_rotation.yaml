document:
  id: CO5-06
  title: Secrets Management, Rotation and Audit Evidence
  session_alignment: '19'
  focus: Distinguish keys from secrets, secure storage, retrieval, rotation and audit-trail evidence.
  level: Detailed undergraduate study notes
  important_scope_note: Provider-specific details are conceptual examples. Verify current provider documentation
    before implementing production controls.
learning_objectives:
- Explain the central concepts and terminology.
- Analyze the control flow and identify trust boundaries.
- Compare alternative designs and their trade-offs.
- Apply least privilege and validate it with evidence.
- Diagnose a realistic failure using logs, policies or telemetry.
units:
- unit: 1
  title: What counts as a secret
  explanation: A secret is sensitive authentication or authorization material such as a password, API token, database
    credential, private key, signing secret or connection string containing credentials. A cryptographic key is
    a specific kind of sensitive material used in cryptographic operations; secrets management and key management
    overlap but are not identical. Treat secrets as assets with owners, scope, expiry, storage and rotation requirements.
  key_points:
  - 'Examples: database passwords, API tokens, OAuth client secrets, private keys and webhook signing secrets.'
  - Do not confuse a secret value with a public identifier or non-sensitive configuration.
  - Classify secrets by privilege, environment, service dependency and impact if exposed.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 2
  title: Why source-code storage is unsafe
  explanation: Hard-coded secrets can leak through source control, forks, build artifacts, package registries, screenshots
    and logs. Deleting a secret from the latest source file does not remove it from Git history or copies. Environment
    variables are often better than hard-coding but can still leak through process inspection, crash dumps or diagnostic
    output. Use a dedicated secrets manager or protected runtime injection mechanism.
  key_points:
  - Never commit production credentials to source control.
  - Use secret scanning in repositories and CI pipelines.
  - Avoid printing secrets in logs or exception messages.
  - Revoke exposed credentials; do not rely only on deleting the file.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 3
  title: Secrets manager architecture
  explanation: A secrets manager stores encrypted secret values and controls retrieval through identity policies.
    Applications authenticate using workload identity, request only the named secret and receive it at runtime.
    Centralized secret management supports versioning, audit logs, rotation workflows and access review. Avoid retrieving
    a broad collection of secrets into a shared environment.
  key_points:
  - Workload authenticates with temporary identity.
  - Policy authorizes access to one secret or a narrow path.
  - Secret manager returns the current version over a protected channel.
  - Application avoids logging and minimizes in-memory lifetime.
  - Audit event records the principal and secret access where supported.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 4
  title: Rotation strategies
  explanation: Rotation changes a secret while maintaining service availability. A safe pattern may create a new
    credential, update the consumer, validate successful use, and then revoke the old credential. Some systems support
    overlapping credentials; others require coordinated updates. Database rotation may involve dual-user or staged
    password changes. Design rotation around application behavior rather than assuming every secret can be changed
    instantly.
  key_points:
  - 'Scheduled rotation: periodic replacement based on risk and policy.'
  - 'Event-driven rotation: replace after suspected exposure or personnel change.'
  - 'Automated rotation: orchestrated update of secret store and dependent service.'
  - 'Grace period: allow controlled overlap only when supported and justified.'
  - 'Post-rotation validation: prove the workload uses the new version.'
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 5
  title: Audit evidence that rotation occurred
  explanation: 'A rotation claim should be supported by evidence: rotation job execution, secret version change,
    actor or automation identity, timestamp, target secret, dependent-service update and successful validation.
    A timestamp alone is not proof that consumers stopped using the old credential. Audit evidence should be protected
    from modification and retained according to policy.'
  key_points:
  - 'Before state: secret version identifier and rotation due date.'
  - 'Execution: automation identity, job ID, event timestamp and outcome.'
  - 'After state: new version identifier and service update evidence.'
  - 'Validation: successful connection with new credential; old credential rejected when safe to test.'
  - 'Exception: failed rotation alert, owner and remediation record.'
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 6
  title: Secret access patterns and caching
  explanation: Frequent secret retrieval can create latency and service dependency. Applications may cache secrets
    briefly, but cache duration affects revocation speed and exposure window. Use bounded cache lifetimes, refresh
    on rotation signals where available, and avoid persisting plaintext to disk. Do not cache secrets indefinitely
    in long-running processes.
  key_points:
  - Choose a cache TTL based on risk, rotation cadence and service availability.
  - Use secure memory handling where practical; avoid debug dumps.
  - Ensure refresh failures do not silently fall back to expired credentials forever.
  - Monitor access anomalies and unexpected retrieval volume.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 7
  title: Incident response for leaked secrets
  explanation: Treat a leaked credential as compromised even if there is no evidence of abuse. Identify secret owner,
    permissions, dependent systems and exposure window. Revoke or rotate it, inspect audit events, search for additional
    copies and assess data access. If the secret is a private key or signing key, evaluate forged tokens, signed
    artifacts or trust relationships that may be affected.
  key_points:
  - 'Contain: revoke or disable the exposed credential.'
  - 'Scope: identify services and resources reachable with it.'
  - 'Investigate: audit access, source locations and suspicious activity.'
  - 'Recover: issue replacement, update consumers and validate.'
  - 'Prevent: add scanning, policy gates, rotation and ownership metadata.'
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
- unit: 8
  title: Secret-management design exercise
  explanation: Design a database connection flow in which an application obtains a temporary workload identity,
    reads one database secret at startup or refresh, connects over TLS and emits no credential values to logs. Define
    rotation steps, overlap period, audit events and failure behavior. Include a test showing an unrelated workload
    cannot retrieve the secret.
  key_points:
  - Identify the application principal and exact secret identifier.
  - Define read permission and deny access to neighboring secrets.
  - Describe rotation and consumer update sequence.
  - List evidence proving rotation completed.
  - Define alerts for failed rotation and unusual secret access.
  study_actions:
  - Define the concept in your own words.
  - Draw or write the request/data flow where applicable.
  - Identify one security failure mode and its mitigation.
  - Create one positive test and one negative test.
worked_examples:
- scenario: A service needs to read one configuration object and nothing else.
  analysis: Identify its workload principal, exact read action, exact resource and any required context. Avoid broad
    account-wide permissions.
  expected_design: A dedicated workload identity with a narrowly scoped read permission and an explicit negative
    test against an unrelated object.
- scenario: A cloud API call returns AccessDenied even though an Allow statement exists.
  analysis: Check for explicit denies, resource policy restrictions, permission boundaries, session restrictions,
    organization guardrails and failed conditions.
  expected_design: Use the audit event and policy evidence to identify the controlling layer; change only that layer
    and retest.
common_misconceptions:
- Authentication success does not mean every requested action is authorized.
- A permission boundary or organization guardrail is not automatically a permission grant.
- Adding an Allow does not override a matching explicit Deny.
- Temporary credentials reduce long-lived credential risk but still require least privilege.
- Encryption does not replace authorization, secure application design or key protection.
- A compliance dashboard is not proof that every control is effective.
- A metric alert is not useful unless it leads to a clear action.
self_check:
- question: What principal is making the request, and what action/resource is being requested?
  expected_answer_elements:
  - identity
  - action
  - resource
  - context
- question: What is the difference between an explicit deny and an implicit deny?
  expected_answer_elements:
  - matching deny rule
  - absence of an applicable allow
- question: Why is workload identity preferable to a hard-coded static key?
  expected_answer_elements:
  - short-lived credentials
  - reduced leakage surface
  - scoped role
- question: What evidence demonstrates that a secret was rotated successfully?
  expected_answer_elements:
  - version change
  - automation/audit event
  - consumer update
  - validation
- question: How do metrics, logs and traces complement one another?
  expected_answer_elements:
  - aggregate trends
  - event detail
  - request path
exam_practice:
  short_answer:
  - Define least privilege and explain why it must be reviewed continuously.
  - Differentiate identity-based and resource-based policies.
  - Explain the purpose of a service control policy.
  - Differentiate a cryptographic key from an application secret.
  - Define SLI, SLO and error budget.
  analytical:
  - Analyze an AccessDenied request when identity policy allows the action but an organization guardrail denies
    it.
  - Design a workload identity flow for a containerized application.
  - Propose an envelope-encryption architecture and explain key ownership.
  - Map a compliance requirement to controls and auditable evidence.
  - Evaluate an alerting design that pages operators on every CPU spike.
  case_study: A production service suddenly cannot read a database secret. Determine the evidence to collect, policy
    layers to inspect, likely rotation-related causes, safe remediation and validation tests.
glossary:
- term: IAM
  definition: Identity and access management.
- term: Principal
  definition: Identity making an access request.
- term: Federation
  definition: Trust relationship that allows an external identity system to provide authentication assertions or
    tokens.
- term: SCP
  definition: Organization-level policy that limits maximum permissions in supported account models.
- term: KMS
  definition: Key management service used to manage cryptographic keys and operations.
- term: DEK
  definition: Data encryption key used to encrypt data.
- term: WAF
  definition: Web application firewall that evaluates HTTP/HTTPS requests.
- term: SLI
  definition: Measured indicator of service behavior.
- term: SLO
  definition: Target for an SLI over a defined time window.
- term: Trace
  definition: Linked spans representing a request's path through services.
