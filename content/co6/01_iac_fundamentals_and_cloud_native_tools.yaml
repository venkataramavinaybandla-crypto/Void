course: Cloud Infrastructure and Services
course_code: 25CS2206E
course_outcome: CO6
course_outcome_statement: Evaluate and apply Infrastructure-as-Code, deployment strategies, operational lifecycle
  practice and cost-engineering technique to provision, release, operate and financially optimize cloud infrastructure
  reproducibly; and justify each choice against its measured operational and monetary cost.
taxonomy_level: BTL 5 — Evaluate
source_alignment:
  session_21: Terraform, Infrastructure State, and Remote Locking
  session_22: IaC Modules, CI/CD, Deployment, and Infrastructure Drift
  session_23: Operations, Cloud Billing, and Cost Optimization
  session_24: Integrated SkyDeploy Project and Architecture Defence — Cost engineering, optimization, PodYard, final
    integration
  practical_session_11: Analyze module dependencies, remote-state configuration and state locking; implement reusable
    modules and verify repeatable provisioning.
  practical_session_12: Analyze Terraform plans and state information to identify infrastructure drift; diagnose
    a controlled state-management problem and evaluate safe recovery options.
  practical_session_21: Evaluate Session Manager and VPC endpoint configurations; configure bastion-free access
    and validate private service connectivity.
  practical_session_22: Evaluate self-provisioned Kubernetes architecture, networking and operational requirements;
    provision cluster, deploy workload and validate service discovery.
  practical_session_23: Evaluate Kubernetes workload configuration; diagnose and repair a deliberately broken BookStash
    deployment using Kubernetes commands and logs.
  practical_session_24: Evaluate end-to-end architecture, break-fix evidence, recovery results and cost trade-offs;
    defend architecture decisions using Terraform evidence, diagnostic logs, measured RTO/RPO and actual cost results.
document:
  id: CO6-01
  title: Infrastructure as Code Fundamentals and Cloud-Native IaC Choices
  lecture_session_alignment: '21'
  scope: Detailed study notes and applied revision material
  source_note: Official session/practical alignment follows the supplied course handout. Explanations and examples
    are expanded learning material.
learning_objectives:
- Explain the concepts and lifecycle involved.
- Evaluate alternative tools and operational approaches.
- Apply repeatable, secure infrastructure workflows.
- Interpret plans, state, logs, metrics and cost evidence.
- Justify decisions against reliability, security, SLO and monetary constraints.
units:
- unit: 1
  title: Infrastructure as Code (IaC)
  explanation: Infrastructure as Code represents infrastructure configuration in machine-readable files that can
    be reviewed, versioned, tested and applied repeatedly. It changes infrastructure provisioning from an ad hoc
    sequence of console actions into a controlled engineering workflow. IaC can describe networks, compute, identity,
    storage, databases, monitoring and policy. Reproducibility depends on versioned inputs, controlled state, provider
    behavior and disciplined change review.
  key_points:
  - 'Declarative model: describe the desired end state; the tool determines required changes.'
  - 'Imperative model: specify the sequence of operations to perform.'
  - IaC reduces undocumented manual configuration but does not eliminate operational responsibility.
  - 'Treat infrastructure definitions as production code: review, test, secure and release them.'
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 2
  title: Desired state, actual state and reconciliation
  explanation: Desired state is what configuration declares should exist. Actual state is what exists in the provider.
    A tool compares the two and proposes changes to reconcile differences. Reconciliation can create, update or
    destroy resources. A plan is a prediction based on configuration, state and refreshed provider data; it is not
    a guarantee that every operation will succeed.
  key_points:
  - 'Configuration: declared target design.'
  - 'State: tool-maintained mapping between configuration and managed objects.'
  - 'Provider reality: live resources and their current attributes.'
  - 'Plan: proposed actions and computed differences.'
  - 'Apply: execution of an approved plan, subject to runtime failures and external changes.'
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 3
  title: Declarative versus imperative provisioning
  explanation: Declarative tools are effective when the desired result can be expressed as resources and dependencies.
    Imperative scripts are useful for procedural tasks, bootstrapping or operations that lack a declarative resource
    model. Imperative scripts can become fragile when rerun because they may not be idempotent. A robust platform
    may combine declarative infrastructure with carefully controlled configuration-management steps.
  key_points:
  - 'Declarative: state the result, such as a private subnet and route table.'
  - 'Imperative: issue explicit commands to create or modify resources.'
  - 'Idempotence: repeating an operation does not create unintended additional changes.'
  - Prefer provider-supported declarative resources for long-lived infrastructure.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 4
  title: Terraform workflow and core objects
  explanation: Terraform commonly follows init, validate, plan, review and apply. Providers translate configuration
    into API operations. Resources manage infrastructure objects; data sources read existing information; variables
    parameterize reusable configuration; outputs expose selected values. Modules package related resources and interfaces.
    The workflow should be run in a controlled environment with pinned tool/provider versions and protected state.
  key_points:
  - 'terraform init: initialize working directory and provider/module dependencies.'
  - 'terraform fmt: normalize formatting.'
  - 'terraform validate: check configuration structure and arguments.'
  - 'terraform plan: preview proposed changes.'
  - 'terraform apply: execute changes after review.'
  - 'terraform destroy: destructive lifecycle operation; use only with explicit approval and correct target.'
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 5
  title: Cloud-native IaC alternatives
  explanation: 'The handout asks students to analyze portable and native IaC choices: Terraform, CloudFormation/CDK,
    Bicep/ARM and Google Cloud deployment tooling. Terraform is commonly used across providers; native tools can
    offer close integration with one cloud''s resource model and ecosystem. The choice should consider provider
    fit, repeatability, drift handling, multi-account rollout, team skills and long-term maintenance.'
  key_points:
  - 'Terraform: provider-based ecosystem and reusable modules across platforms.'
  - 'AWS CloudFormation/CDK: AWS-native infrastructure modeling; CDK synthesizes templates.'
  - 'Azure Bicep/ARM: Azure-native declarative resource deployment.'
  - 'Google Cloud deployment tooling: provider-native deployment/configuration options; verify current product lifecycle
    and recommendations.'
  - Do not choose portability as an absolute goal if it adds unnecessary complexity.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 6
  title: Reproducibility and dependency management
  explanation: Repeatable provisioning requires consistent inputs and dependency versions. Pin provider versions
    within a tested range, commit lock files, document module versions and use separate configuration for environment-specific
    values. Avoid embedding secrets in source. A reproducible plan also depends on state integrity and controlled
    external changes.
  key_points:
  - Pin Terraform and provider versions deliberately.
  - Commit the dependency lock file where appropriate.
  - Use variables for environment-specific settings and validated defaults.
  - Keep secrets out of configuration, plan artifacts and repository history.
  - Document module source and version.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 7
  title: Testing and validation for IaC
  explanation: Testing ranges from formatting and static validation to policy checks, plan review and integration
    tests in a temporary environment. Tests should verify both intended resources and security boundaries. A successful
    syntax check does not prove the infrastructure is secure, available or cost-effective. Use test environments
    and avoid applying unreviewed destructive changes.
  key_points:
  - 'Static checks: formatting, syntax, type and provider validation.'
  - 'Plan review: inspect replacements, deletions, public exposure and cost-impacting changes.'
  - 'Policy checks: enforce tags, encryption, network restrictions and approved regions.'
  - 'Integration tests: verify deployed connectivity and application behavior.'
  - 'Cleanup: destroy test resources safely and verify no billable resources remain.'
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 8
  title: IaC architecture decision framework
  explanation: Choose tools based on lifecycle ownership, provider coverage, team experience, policy integration,
    state model, module ecosystem, testing, drift handling and operational cost. Document trade-offs and avoid claiming
    that a tool is automatically portable or drift-free. A good decision identifies what is standardized and what
    remains provider-specific.
  key_points:
  - State the workload and provider constraints.
  - Compare at least two viable tools against explicit criteria.
  - Identify state, secrets, policy and deployment dependencies.
  - Estimate maintenance cost and operational risk.
  - Record decision, assumptions and review triggers.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
worked_scenarios:
- scenario: Two engineers attempt to modify the same production infrastructure state.
  analysis: Check remote backend, lock ownership and whether another operation is active. Avoid force-unlock without
    confirming the lock is stale.
  safe_response: Serialize state mutation, preserve state versions, review the plan and verify provider reality.
- scenario: A monthly bill spikes while Terraform reports drift.
  analysis: Correlate billing, resource usage, deployment history, audit events, IaC plan and SLO telemetry. Drift
    may be intentional and cost may be caused by a separate usage change.
  safe_response: Stabilize service, collect evidence, classify drift, remediate with a reviewed change and measure
    actual cost and SLO impact.
common_misconceptions:
- IaC does not make infrastructure changes automatically safe.
- A Terraform plan is a proposal, not proof that apply will succeed.
- Remote state does not remove the need for locking and access control.
- A state lock does not replace code review or change approval.
- Drift must be understood before it is codified or reverted.
- Application rollback does not always reverse infrastructure or data changes.
- A budget alert is not necessarily a hard spending cap.
- Lower cost is not an improvement if the published SLO is violated.
self_check:
- question: What is the purpose of Terraform state?
  answer_elements:
  - maps configuration addresses to real objects
  - supports planning
  - may contain sensitive values
- question: Why is remote state locking important for teams?
  answer_elements:
  - prevents concurrent state mutation
  - reduces conflicting operations
  - coordinate shared workflow
- question: What is infrastructure drift and how should it be handled?
  answer_elements:
  - difference between declared and actual state
  - investigate cause
  - codify or revert deliberately
- question: How should an IaC change move through CI/CD?
  answer_elements:
  - validation
  - plan review
  - approval
  - apply
  - post-deployment verification
- question: How can cloud cost optimization be evaluated responsibly?
  answer_elements:
  - billing evidence
  - unit economics
  - SLO impact
  - actual savings
exam_practice:
  short_answer:
  - Differentiate declarative and imperative infrastructure provisioning.
  - Explain Terraform state and remote locking.
  - Define reusable modules and explain module versioning.
  - Explain infrastructure drift and the codify-versus-revert decision.
  - Differentiate rolling, blue-green and canary deployments.
  - Define RTO and RPO and explain how they are measured.
  analytical:
  - Evaluate Terraform and a cloud-native IaC tool for a multi-account environment.
  - Analyze a plan containing resource replacement and explain the review steps.
  - Design an IaC CI/CD pipeline with least-privilege deployment identity.
  - Diagnose a broken Kubernetes workload using events, logs, selectors and probes.
  - Analyze NAT, cross-zone and egress charges and propose optimizations.
  - Evaluate a drift-and-cost-spike incident while preserving an SLO.
  case_study: A production environment has a Terraform drift alert, a sudden network cost increase and elevated
    application latency. Prepare an evidence-led investigation, safe remediation sequence, rollback plan and post-change
    cost/SLO validation.
glossary:
- term: IaC
  definition: Infrastructure as Code.
- term: State
  definition: Terraform's mapping between configuration and managed infrastructure objects.
- term: Backend
  definition: Configuration describing where and how state is stored.
- term: State locking
  definition: Coordination that prevents concurrent state-changing operations.
- term: Module
  definition: Reusable package of infrastructure configuration.
- term: Drift
  definition: Difference between declared/managed configuration and actual infrastructure.
- term: CI/CD
  definition: Continuous integration and continuous delivery/deployment workflows.
- term: SLO
  definition: Target for a measured service-level indicator.
- term: RTO
  definition: Target time to restore service after disruption.
- term: RPO
  definition: Maximum acceptable data-loss interval.
- term: FinOps
  definition: Collaborative operating practice for cloud financial accountability and optimization.
