document:
  id: CO6-03
  title: Reusable IaC Modules, Version Control and Infrastructure Drift
  lecture_session_alignment: '22'
  scope: Detailed study notes and applied revision material
  source_note: Official session/practical alignment follows the supplied course handout. Explanations and examples
    are expanded learning material.
learning_objectives:
- Explain the concepts and lifecycle involved.
- Evaluate alternative tools and operational approaches.
- Apply repeatable, secure infrastructure workflows.
- Interpret plans, state, logs, metrics and cost evidence.
- Justify decisions against reliability, security, SLO and monetary constraints.
units:
- unit: 1
  title: Why reusable modules matter
  explanation: Modules package related resources behind a defined interface. Reuse reduces duplication and makes
    infrastructure patterns easier to review and maintain. A module should expose inputs and outputs intentionally,
    use clear naming, document assumptions and avoid excessive hidden behavior. A module is not automatically safe
    merely because it is reusable; its defaults and permissions must be reviewed.
  key_points:
  - 'Root module: configuration in the working directory.'
  - 'Child module: reusable configuration called by another module.'
  - 'Inputs: variables that configure behavior.'
  - 'Outputs: selected values exposed to callers.'
  - 'Resources: actual managed infrastructure objects.'
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 2
  title: Module design and interfaces
  explanation: 'Good modules have focused responsibility, predictable defaults, validated inputs and minimal provider
    assumptions. Avoid creating a giant module that manages an entire enterprise platform with dozens of unrelated
    options. Use composition: small modules for network, compute, identity and monitoring can be assembled by environment-level
    root modules.'
  key_points:
  - Single clear purpose and documented scope.
  - Typed and validated inputs.
  - Stable outputs with meaningful names.
  - Secure defaults and explicit opt-ins for public exposure.
  - Document provider and version requirements.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 3
  title: Module versioning and consumption
  explanation: Version modules so consumers can adopt changes deliberately. Pin module versions or immutable source
    references for production. Test module changes before publishing and maintain compatibility notes. A breaking
    change should be versioned and communicated; unpinned main-branch consumption can make builds non-reproducible.
  key_points:
  - Use version tags or immutable references.
  - Pin dependencies for controlled production deployment.
  - Maintain changelog and migration notes.
  - Test old and new consumer configurations.
  - Avoid mutable references for critical production workflows.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 4
  title: Version control workflow for infrastructure
  explanation: Infrastructure code should use branches, pull requests, peer review and protected main branches.
    A pull request should include a plan summary, security implications, replacements/deletions, cost impact and
    rollback considerations. Secrets and state files must not be committed. Keep commits focused so reviewers can
    understand the intended change.
  key_points:
  - Branch from a known baseline.
  - Make a focused infrastructure change.
  - Run formatting, validation and policy checks.
  - Generate and review a plan in a controlled environment.
  - Require approval for production and destructive changes.
  - Merge and apply through an authorized pipeline.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 5
  title: Environment separation
  explanation: Development, test, staging and production require different risk controls, credentials, scale and
    sometimes topology. Environment separation can use separate accounts/subscriptions/projects, state files, variable
    sets and deployment approvals. Do not rely only on a variable called environment if the underlying permissions
    and state remain shared.
  key_points:
  - Separate production state and credentials.
  - Use environment-specific variable files or pipeline inputs.
  - Promote tested module versions between environments.
  - Keep production access and approvals more restrictive.
  - Avoid copying production secrets into lower environments.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 6
  title: Infrastructure drift
  explanation: Drift occurs when actual infrastructure differs from the configuration/state model, often because
    someone changed a resource manually, an external automation modified it or provider defaults changed. Drift
    may be intentional emergency remediation or an unmanaged change. Detecting drift is not enough; engineers must
    decide whether to codify the change or revert it.
  key_points:
  - Run a plan/refresh process to reveal differences.
  - Identify who or what changed the resource and why.
  - Assess security, availability and cost impact.
  - Codify an approved intended change in IaC, or revert an unauthorized change.
  - Re-run plan and confirm the desired end state.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 7
  title: Plan interpretation and safe apply
  explanation: A plan may show create, update, delete or replacement. Replacement can be especially disruptive if
    a resource is immutable or has dependent resources. Review every destructive action, dependency and computed
    value. Applying without reconciliation can overwrite intentional changes or cause downtime. If the plan is surprising,
    stop and investigate.
  key_points:
  - 'Create: new object is proposed.'
  - 'Update in-place: existing object changes without replacement where supported.'
  - 'Destroy: object removal is proposed.'
  - 'Replace: old object is destroyed and a new one created.'
  - 'Unknown values: provider may calculate values during apply.'
  - Do not apply when plan scope or consequence is unclear.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 8
  title: Drift governance exercise
  explanation: A production security group has a manually added inbound rule during an incident. Terraform now proposes
    removing it. Determine whether the rule is still required, whether the incident has ended, and whether the change
    was approved. If permanent, codify a narrow rule with an owner and expiry/justification. If temporary, remove
    it through the approved process and verify the next plan is clean.
  key_points:
  - Collect change event, actor and incident reference.
  - Assess whether the manual change remains necessary.
  - Select codify or revert and document rationale.
  - Update configuration or live resource through controlled workflow.
  - Run plan and preserve evidence of reconciliation.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
worked_scenarios:
- scenario: Two engineers attempt to modify the same production infrastructure state.
  analysis: Check remote backend, lock ownership and whether another operation is active. Avoid force-unlock without
    confirming the lock is stale.
  safe_response: Serialize state mutation, preserve state versions, review the plan and verify provider reality.
- scenario: A monthly bill spikes while Terraform reports drift.
  analysis: Correlate billing, resource usage, deployment history, audit events, IaC plan and SLO telemetry. Drift
    may be intentional and cost may be caused by a separate usage change.
  safe_response: Stabilize service, collect evidence, classify drift, remediate with a reviewed change and measure
    actual cost and SLO impact.
common_misconceptions:
- IaC does not make infrastructure changes automatically safe.
- A Terraform plan is a proposal, not proof that apply will succeed.
- Remote state does not remove the need for locking and access control.
- A state lock does not replace code review or change approval.
- Drift must be understood before it is codified or reverted.
- Application rollback does not always reverse infrastructure or data changes.
- A budget alert is not necessarily a hard spending cap.
- Lower cost is not an improvement if the published SLO is violated.
self_check:
- question: What is the purpose of Terraform state?
  answer_elements:
  - maps configuration addresses to real objects
  - supports planning
  - may contain sensitive values
- question: Why is remote state locking important for teams?
  answer_elements:
  - prevents concurrent state mutation
  - reduces conflicting operations
  - coordinate shared workflow
- question: What is infrastructure drift and how should it be handled?
  answer_elements:
  - difference between declared and actual state
  - investigate cause
  - codify or revert deliberately
- question: How should an IaC change move through CI/CD?
  answer_elements:
  - validation
  - plan review
  - approval
  - apply
  - post-deployment verification
- question: How can cloud cost optimization be evaluated responsibly?
  answer_elements:
  - billing evidence
  - unit economics
  - SLO impact
  - actual savings
exam_practice:
  short_answer:
  - Differentiate declarative and imperative infrastructure provisioning.
  - Explain Terraform state and remote locking.
  - Define reusable modules and explain module versioning.
  - Explain infrastructure drift and the codify-versus-revert decision.
  - Differentiate rolling, blue-green and canary deployments.
  - Define RTO and RPO and explain how they are measured.
  analytical:
  - Evaluate Terraform and a cloud-native IaC tool for a multi-account environment.
  - Analyze a plan containing resource replacement and explain the review steps.
  - Design an IaC CI/CD pipeline with least-privilege deployment identity.
  - Diagnose a broken Kubernetes workload using events, logs, selectors and probes.
  - Analyze NAT, cross-zone and egress charges and propose optimizations.
  - Evaluate a drift-and-cost-spike incident while preserving an SLO.
  case_study: A production environment has a Terraform drift alert, a sudden network cost increase and elevated
    application latency. Prepare an evidence-led investigation, safe remediation sequence, rollback plan and post-change
    cost/SLO validation.
glossary:
- term: IaC
  definition: Infrastructure as Code.
- term: State
  definition: Terraform's mapping between configuration and managed infrastructure objects.
- term: Backend
  definition: Configuration describing where and how state is stored.
- term: State locking
  definition: Coordination that prevents concurrent state-changing operations.
- term: Module
  definition: Reusable package of infrastructure configuration.
- term: Drift
  definition: Difference between declared/managed configuration and actual infrastructure.
- term: CI/CD
  definition: Continuous integration and continuous delivery/deployment workflows.
- term: SLO
  definition: Target for a measured service-level indicator.
- term: RTO
  definition: Target time to restore service after disruption.
- term: RPO
  definition: Maximum acceptable data-loss interval.
- term: FinOps
  definition: Collaborative operating practice for cloud financial accountability and optimization.
