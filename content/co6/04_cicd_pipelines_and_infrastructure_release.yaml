document:
  id: CO6-04
  title: CI/CD for Infrastructure, Deployment Strategies and Release Safety
  lecture_session_alignment: '22'
  scope: Detailed study notes and applied revision material
  source_note: Official session/practical alignment follows the supplied course handout. Explanations and examples
    are expanded learning material.
learning_objectives:
- Explain the concepts and lifecycle involved.
- Evaluate alternative tools and operational approaches.
- Apply repeatable, secure infrastructure workflows.
- Interpret plans, state, logs, metrics and cost evidence.
- Justify decisions against reliability, security, SLO and monetary constraints.
units:
- unit: 1
  title: CI/CD foundations
  explanation: Continuous integration validates changes frequently; continuous delivery keeps changes ready for
    controlled release; continuous deployment automatically releases qualifying changes. Infrastructure pipelines
    apply the same principles to cloud resources. A pipeline should make changes repeatable, auditable and reversible
    where possible. Automation must not turn every commit into unrestricted production access.
  key_points:
  - 'CI: format, validate, lint, test and inspect configuration changes.'
  - 'CD: promote and apply approved changes to target environments.'
  - 'Artifact: versioned configuration and any generated deployment package.'
  - 'Pipeline identity: short-lived, narrowly scoped workload identity.'
  - 'Approval: human or policy gate for high-impact production actions.'
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 2
  title: Pipeline stages for IaC
  explanation: A typical pipeline checks out a reviewed commit, installs pinned tool versions, initializes providers,
    formats and validates configuration, runs security/policy checks, creates a plan, stores a protected plan artifact
    and applies it after approval. The applied plan should correspond to the reviewed commit and intended environment.
  key_points:
  - Source control event and commit identity.
  - Dependency initialization with pinned versions.
  - Static validation and security scanning.
  - Plan generation and artifact protection.
  - Approval and controlled apply.
  - Post-deployment verification and evidence capture.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 3
  title: Pipeline security and identity
  explanation: CI systems need cloud permissions, but long-lived access keys stored in pipeline variables increase
    risk. Prefer workload identity federation or short-lived role credentials. Restrict trust to approved repository,
    branch, workflow and environment. Separate read-only plan permissions from apply permissions when feasible,
    and isolate production deployment jobs.
  key_points:
  - Use short-lived credentials and narrow role scopes.
  - Protect secrets and environment variables from untrusted jobs.
  - Do not expose production deployment identity to arbitrary pull requests.
  - Require approvals and branch protections.
  - Log pipeline identity, plan and apply outcomes.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 4
  title: Deployment strategies
  explanation: Deployment strategy determines how a new version reaches users and how failure is handled. Rolling
    deployment replaces instances gradually. Blue-green uses two environments and shifts traffic after validation.
    Canary sends a small portion of traffic to the new version before broader rollout. Recreate stops the old version
    before starting the new one and may cause downtime.
  key_points:
  - 'Rolling: gradual replacement; monitor capacity and compatibility.'
  - 'Blue-green: fast traffic switch and rollback, but temporarily needs duplicate capacity.'
  - 'Canary: limits blast radius and provides early production signals.'
  - 'Recreate: simple but may introduce downtime.'
  - Choose based on state compatibility, availability target, cost and rollback complexity.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 5
  title: Infrastructure release versus application release
  explanation: Infrastructure changes may alter network routes, database schemas, identity policies, load balancers
    or persistent storage. Application rollback does not necessarily reverse infrastructure safely. Plan infrastructure
    and application releases together when dependencies exist. Database migrations often need backward-compatible
    expand-and-contract sequencing.
  key_points:
  - Identify dependencies between application and infrastructure versions.
  - Use backward-compatible changes where possible.
  - Separate risky data migrations from stateless code rollout.
  - Define rollback and forward-fix options before release.
  - Verify service health after each stage.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 6
  title: Post-deployment validation
  explanation: A successful pipeline does not prove that users can reach the service or that security controls remain
    correct. Validate health endpoints, connectivity, service discovery, logs, metrics, traces, identity permissions
    and expected resource state. Compare measured behavior with the pre-release baseline and SLO.
  key_points:
  - Check deployment status and desired replica count.
  - Verify endpoint and service discovery.
  - Run smoke tests and critical user journeys.
  - Inspect error rate, latency and saturation.
  - Confirm no unintended public exposure or permission expansion.
  - Record evidence and release version.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 7
  title: Rollback and recovery planning
  explanation: Rollback restores a known-good state or traffic path. Some infrastructure changes are not safely
    reversible, especially destructive database or storage operations. Define rollback triggers, decision authority,
    state recovery, traffic reversal and data compatibility. When rollback is unsafe, a forward fix may be the better
    option.
  key_points:
  - Define measurable rollback triggers.
  - Preserve known-good artifact and configuration version.
  - Check whether data changes are backward compatible.
  - Use staged rollback and verify service health.
  - Capture timeline and follow-up remediation.
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
- unit: 8
  title: Release governance checklist
  explanation: A production release record should include change description, owner, commit, plan, risk, expected
    cost, security impact, approval, test evidence, deployment window, rollback plan and post-release result. High-risk
    changes should receive additional review and staged rollout.
  key_points:
  - Is the plan reviewed and tied to the commit?
  - Are destructive actions understood?
  - Are approvals and deployment permissions scoped?
  - Are monitoring and rollback ready?
  - Is cost impact estimated and tracked?
  practice:
  - Write a concise definition.
  - Draw the workflow or dependency path.
  - Identify one failure mode and its safe response.
  - State what evidence would prove the result.
worked_scenarios:
- scenario: Two engineers attempt to modify the same production infrastructure state.
  analysis: Check remote backend, lock ownership and whether another operation is active. Avoid force-unlock without
    confirming the lock is stale.
  safe_response: Serialize state mutation, preserve state versions, review the plan and verify provider reality.
- scenario: A monthly bill spikes while Terraform reports drift.
  analysis: Correlate billing, resource usage, deployment history, audit events, IaC plan and SLO telemetry. Drift
    may be intentional and cost may be caused by a separate usage change.
  safe_response: Stabilize service, collect evidence, classify drift, remediate with a reviewed change and measure
    actual cost and SLO impact.
common_misconceptions:
- IaC does not make infrastructure changes automatically safe.
- A Terraform plan is a proposal, not proof that apply will succeed.
- Remote state does not remove the need for locking and access control.
- A state lock does not replace code review or change approval.
- Drift must be understood before it is codified or reverted.
- Application rollback does not always reverse infrastructure or data changes.
- A budget alert is not necessarily a hard spending cap.
- Lower cost is not an improvement if the published SLO is violated.
self_check:
- question: What is the purpose of Terraform state?
  answer_elements:
  - maps configuration addresses to real objects
  - supports planning
  - may contain sensitive values
- question: Why is remote state locking important for teams?
  answer_elements:
  - prevents concurrent state mutation
  - reduces conflicting operations
  - coordinate shared workflow
- question: What is infrastructure drift and how should it be handled?
  answer_elements:
  - difference between declared and actual state
  - investigate cause
  - codify or revert deliberately
- question: How should an IaC change move through CI/CD?
  answer_elements:
  - validation
  - plan review
  - approval
  - apply
  - post-deployment verification
- question: How can cloud cost optimization be evaluated responsibly?
  answer_elements:
  - billing evidence
  - unit economics
  - SLO impact
  - actual savings
exam_practice:
  short_answer:
  - Differentiate declarative and imperative infrastructure provisioning.
  - Explain Terraform state and remote locking.
  - Define reusable modules and explain module versioning.
  - Explain infrastructure drift and the codify-versus-revert decision.
  - Differentiate rolling, blue-green and canary deployments.
  - Define RTO and RPO and explain how they are measured.
  analytical:
  - Evaluate Terraform and a cloud-native IaC tool for a multi-account environment.
  - Analyze a plan containing resource replacement and explain the review steps.
  - Design an IaC CI/CD pipeline with least-privilege deployment identity.
  - Diagnose a broken Kubernetes workload using events, logs, selectors and probes.
  - Analyze NAT, cross-zone and egress charges and propose optimizations.
  - Evaluate a drift-and-cost-spike incident while preserving an SLO.
  case_study: A production environment has a Terraform drift alert, a sudden network cost increase and elevated
    application latency. Prepare an evidence-led investigation, safe remediation sequence, rollback plan and post-change
    cost/SLO validation.
glossary:
- term: IaC
  definition: Infrastructure as Code.
- term: State
  definition: Terraform's mapping between configuration and managed infrastructure objects.
- term: Backend
  definition: Configuration describing where and how state is stored.
- term: State locking
  definition: Coordination that prevents concurrent state-changing operations.
- term: Module
  definition: Reusable package of infrastructure configuration.
- term: Drift
  definition: Difference between declared/managed configuration and actual infrastructure.
- term: CI/CD
  definition: Continuous integration and continuous delivery/deployment workflows.
- term: SLO
  definition: Target for a measured service-level indicator.
- term: RTO
  definition: Target time to restore service after disruption.
- term: RPO
  definition: Maximum acceptable data-loss interval.
- term: FinOps
  definition: Collaborative operating practice for cloud financial accountability and optimization.
